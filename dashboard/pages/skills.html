<div class="dashboard-form">

    <h2 class="form-title">Add Skill</h2>

    <p class="form-subtitle">
        Add and manage your portfolio skills.
    </p>

    <form id="skillForm">

        <div class="input-group">
            <label>Skill Name</label>
            <input type="text" id="skillName" placeholder="Python" required>
        </div>

        <div class="input-group">
            <label>Font Awesome Icon</label>
            <input type="text" id="skillIcon" placeholder="fa-brands fa-python" required>
        </div>

        <div class="input-group">
            <label>Percentage</label>
            <input type="number" id="skillPercentage" min="0" max="100" placeholder="90" required>
        </div>

        <div class="input-group">
            <label>Display Order</label>
            <input type="number" id="skillOrder" min="1" placeholder="1" required>
        </div>

        <button type="submit" class="save-btn">
            Save Skill
        </button>

    </form>

</div>

<div id="skillList"></div>
